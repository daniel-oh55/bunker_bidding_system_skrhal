name: CI

on:
  push:
    branches:
      - main
      - chore/pr-0-supabase-v2-foundation
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full dependency audit (classification and reporting)
        continue-on-error: true
        run: npm audit --json

      - name: Critical dependency audit (hard gate)
        run: npm audit --audit-level=critical

      - name: Production dependency audit high+ (hard gate)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck app and Node configs
        run: npm run typecheck

      - name: Test application and foundation checker
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Check foundation boundaries
        run: npm run check:foundation

      - name: Check PR diff whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          PUSH_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${PR_BASE_SHA}...${PR_HEAD_SHA}"
          else
            before="$PUSH_BEFORE"
            head="$PUSH_HEAD"
            branch="$PUSH_BRANCH"
            default_branch="$DEFAULT_BRANCH"

            if [[ ! "$before" =~ ^0+$ ]] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "Checking whitespace for push range ${before}...${head}"
              git diff --check "${before}...${head}"
              exit 0
            fi

            range_start=""
            if [[ "$branch" != "$default_branch" ]]; then
              default_ref="refs/remotes/origin/${default_branch}"
              if ! git cat-file -e "${default_ref}^{commit}" 2>/dev/null; then
                default_ref="$default_branch"
              fi

              if git cat-file -e "${default_ref}^{commit}" 2>/dev/null &&
                merge_base="$(git merge-base "$default_ref" "$head" 2>/dev/null)"; then
                range_start="$merge_base"
              fi
            fi

            if [[ -z "$range_start" ]]; then
              if parent="$(git rev-parse --verify "${head}^" 2>/dev/null)"; then
                range_start="$parent"
              else
                echo "Checking whitespace in root commit ${head}"
                git show --check --format=fuller "$head"
                exit 0
              fi
            fi

            echo "Checking whitespace for fallback range ${range_start}...${head}"
            git diff --check "${range_start}...${head}"
          fi
