name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full dependency audit (classification and reporting)
        continue-on-error: true
        run: npm audit --json

      - name: Critical dependency audit (hard gate)
        run: npm audit --audit-level=critical

      - name: Production dependency audit high+ (hard gate)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck app and Node configs
        run: npm run typecheck

      - name: Test application and foundation checker
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Check foundation boundaries
        run: npm run check:foundation

      - name: Check PR diff whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          PUSH_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${PR_BASE_SHA}...${PR_HEAD_SHA}"
          else
            before="$PUSH_BEFORE"
            head="$PUSH_HEAD"
            branch="$PUSH_BRANCH"
            default_branch="$DEFAULT_BRANCH"

            if [[ ! "$before" =~ ^0+$ ]] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "Checking whitespace for push range ${before}...${head}"
              git diff --check "${before}...${head}"
              exit 0
            fi

            range_start=""
            if [[ "$branch" != "$default_branch" ]]; then
              default_ref="refs/remotes/origin/${default_branch}"
              if ! git cat-file -e "${default_ref}^{commit}" 2>/dev/null; then
                default_ref="$default_branch"
              fi

              if git cat-file -e "${default_ref}^{commit}" 2>/dev/null &&
                merge_base="$(git merge-base "$default_ref" "$head" 2>/dev/null)"; then
                range_start="$merge_base"
              fi
            fi

            if [[ -z "$range_start" ]]; then
              if parent="$(git rev-parse --verify "${head}^" 2>/dev/null)"; then
                range_start="$parent"
              else
                echo "Checking whitespace in root commit ${head}"
                git show --check --format=fuller "$head"
                exit 0
              fi
            fi

            echo "Checking whitespace for fallback range ${range_start}...${head}"
            git diff --check "${range_start}...${head}"
          fi

  database-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project-pinned Supabase CLI
        run: npm ci

      - name: Start local Supabase stack
        shell: bash
        run: |
          start_log="$RUNNER_TEMP/supabase-start.log"
          if ! npm run db:start >"$start_log" 2>&1; then
            echo "::error::Supabase start failed. CLI output was withheld because it may contain generated local credentials."
            exit 1
          fi
          rm -f "$start_log"
          echo "Local Supabase stack started."

      - name: Replay migrations from a clean local database
        run: npm run db:reset

      - name: Run pgTAP database tests
        run: npm run db:test

      - name: Resolve and mask local Auth and database values
        shell: bash
        run: |
          status_json="$(npx supabase status -o json)"
          fixture_key_name="SERVICE""_ROLE_KEY"
          api_url="$(jq -er '.API_URL' <<< "$status_json")"
          publishable_key="$(jq -er '.PUBLISHABLE_KEY' <<< "$status_json")"
          fixture_key="$(jq -er --arg name "$fixture_key_name" '.[$name]' <<< "$status_json")"
          db_url="$(jq -er '.DB_URL' <<< "$status_json")"

          [[ "$api_url" == http://* || "$api_url" == https://* ]] || { echo 'Supabase did not return an API URL.'; exit 1; }
          [[ -n "$publishable_key" ]] || { echo 'Supabase did not return a publishable key.'; exit 1; }
          [[ -n "$fixture_key" ]] || { echo 'Supabase did not return an elevated local fixture key.'; exit 1; }
          [[ "$db_url" == postgresql://* ]] || { echo 'Supabase did not return a PostgreSQL database URL.'; exit 1; }

          echo "::add-mask::$publishable_key"
          echo "::add-mask::$fixture_key"
          echo "::add-mask::$db_url"
          {
            echo "LOCAL_API_URL=$api_url"
            echo "LOCAL_PUBLISHABLE_KEY=$publishable_key"
            echo "LOCAL_FIXTURE_KEY=$fixture_key"
            echo "LOCAL_DB_URL=$db_url"
          } >> "$GITHUB_ENV"

      - name: Run membership concurrency regression tests
        run: npm run db:test:concurrency -- "$LOCAL_DB_URL"

      - name: Run bid lifecycle concurrency regression tests
        run: npm run db:test:bid-concurrency -- "$LOCAL_DB_URL"

      - name: Run trader quote and award concurrency regression tests
        run: npm run db:test:quote-concurrency -- "$LOCAL_DB_URL"

      - name: Run frontend Auth access integration tests
        run: npm run auth:test:integration -- "$LOCAL_API_URL" "$LOCAL_PUBLISHABLE_KEY" "$LOCAL_FIXTURE_KEY" "$LOCAL_DB_URL"

      - name: Run trader quote REST integration tests
        run: npm run quote:test:integration -- "$LOCAL_API_URL" "$LOCAL_PUBLISHABLE_KEY" "$LOCAL_FIXTURE_KEY" "$LOCAL_DB_URL"

      - name: Run private Realtime workspace notification integration tests
        run: npm run realtime:test:integration -- "$LOCAL_API_URL" "$LOCAL_PUBLISHABLE_KEY" "$LOCAL_FIXTURE_KEY" "$LOCAL_DB_URL"

      - name: Stop and clean local Supabase stack
        if: always()
        run: npm run db:stop
