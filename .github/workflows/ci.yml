name: CI

on:
  push:
    branches:
      - main
      - chore/pr-0-supabase-v2-foundation
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full dependency audit (classification and reporting)
        continue-on-error: true
        run: npm audit --json

      - name: Critical dependency audit (hard gate)
        run: npm audit --audit-level=critical

      - name: Production dependency audit high+ (hard gate)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck app and Node configs
        run: npm run typecheck

      - name: Test application and foundation checker
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Check foundation boundaries
        run: npm run check:foundation

      - name: Check PR diff whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          fi
